<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <h1>Rock Paper Scissors - Console Version</h1>

    <!-- Player weapon selection buttons -->
    <div id="buttons">
        <button id ="rock">Rock</button>
        <button id ="paper">Paper</button>
        <button id ="scissors">Scissors</button>
    </div>

    <!-- Score and match results display -->
     <div id="results">
        <p id="round-result">Choose your weapon to start the game!</p>
        <p id="score">Player: 0 | Computer: 0</p>
        <h2 id="final-winner"></h2>

        <!-- Reset button (hidden display) -->
         <button id="reset-btn" style="display: none;">Play Again</button>
     </div>

    <script src="script.js"></script>
</body>
</html>
